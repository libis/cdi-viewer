<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDI Viewer - Bundle Test</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/cdi-preview.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <h1>CDI Viewer - Bundle Test</h1>
                <p class="lead">Testing the bundled production version (dist/cdi-viewer.min.js)</p>
                
                <div class="alert alert-info">
                    <strong>Bundle Mode:</strong> This page uses the production bundle instead of individual JS files.
                </div>
                
                <div id="loading-indicator">
                    <div class="alert alert-warning">
                        <i class="glyphicon glyphicon-refresh spinning"></i>
                        Loading CDI data...
                    </div>
                </div>
                
                <div id="data-container" style="display: none;">
                    <!-- Content will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- External Dependencies (from CDN) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/n3@1.16.4/browser/n3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsonld@8.3.2/dist/jsonld.min.js"></script>
    <script src="lib/rdf-validate-shacl.bundle.min.js"></script>

    <!-- Production Bundle -->
    <script src="dist/cdi-viewer.min.js"></script>

    <script>
        // Test bundle initialization
        console.log('=== Bundle Test ===');
        console.log('jQuery loaded:', typeof jQuery !== 'undefined');
        console.log('N3 loaded:', typeof N3 !== 'undefined');
        console.log('jsonld loaded:', typeof jsonld !== 'undefined');
        console.log('SHACLValidator loaded:', typeof SHACLValidator !== 'undefined');
        
        // Check if CDI Viewer functions are available
        console.log('renderData function:', typeof renderData !== 'undefined');
        console.log('loadShapes function:', typeof loadShapes !== 'undefined');
        console.log('validateData function:', typeof validateData !== 'undefined');
        
        // Test with a simple example file
        $(document).ready(function() {
            console.log('Document ready, testing with SimpleSample.jsonld');
            
            // Simulate file loading
            $.getJSON('examples/cdi/SimpleSample.jsonld')
                .done(function(data) {
                    console.log('Loaded SimpleSample.jsonld:', data);
                    
                    // Initialize with the data
                    window.jsonData = data;
                    
                    // Load SHACL shapes and render
                    loadShapes().then(function() {
                        console.log('SHACL shapes loaded successfully');
                        renderData();
                        
                        $('#loading-indicator').hide();
                        $('#data-container').show();
                        
                        console.log('Bundle test: SUCCESS ✅');
                    }).catch(function(error) {
                        console.error('Error loading shapes:', error);
                        $('#loading-indicator').html(
                            '<div class="alert alert-danger">Error loading SHACL shapes: ' + error + '</div>'
                        );
                    });
                })
                .fail(function(error) {
                    console.error('Error loading SimpleSample.jsonld:', error);
                    $('#loading-indicator').html(
                        '<div class="alert alert-danger">Error loading example file: ' + error.statusText + '</div>'
                    );
                });
        });
    </script>
</body>
</html>
